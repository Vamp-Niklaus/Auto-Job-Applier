<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Quota Tester</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #121212; 
            color: #e0e0e0; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 24px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            margin-bottom: 20px; 
            border: 1px solid #333;
        }
        h1 { margin-top: 0; color: #8ab4f8; }
        h2 { color: #8ab4f8; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #9aa0a6; }
        input[type="text"], textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 20px; 
            background: #2d2d2d;
            border: 1px solid #444; 
            color: #fff;
            border-radius: 4px; 
            box-sizing: border-box; 
            font-family: inherit; 
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #8ab4f8;
            outline: none;
        }
        button { 
            background: #8ab4f8; 
            color: #121212; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:hover { background: #9ec1f9; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        pre { 
            background: #000; 
            color: #00ff00; 
            padding: 16px; 
            border-radius: 4px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            border: 1px solid #333;
        }
        .error { color: #f28b82; font-weight: bold; }
        .success { color: #81c995; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>Gemini API Quota Tester</h1>
    <p>The error you received (<code>429 RESOURCE_EXHAUSTED</code>) means you hit the free tier rate limit. Use this tool to test if your API key is working again.</p>
    
    <label for="apiKey">API Key (Stored locally in your browser only):</label>
    <input type="text" id="apiKey" placeholder="Enter your Gemini API Key (AIzaSy...)">
    
    <label for="modelName">Model:</label>
    <input type="text" id="modelName" value="gemini-1.5-flash">
    
    <label for="prompt">Prompt:</label>
    <textarea id="prompt" rows="2">what is 2+2</textarea>
    
    <button id="sendBtn" onclick="testAPI()">Test API</button>
</div>

<div class="card">
    <h2>Request / Response Log (JSON)</h2>
    <div id="status" style="margin-bottom: 10px;">Waiting for input...</div>
    <pre id="jsonOutput">{
  "status": "Ready to test"
}</pre>
</div>

<script>
    async function testAPI() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelName').value.trim();
        const prompt = document.getElementById('prompt').value.trim();
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        const jsonOutput = document.getElementById('jsonOutput');

        if (!apiKey) {
            alert('Please enter your API key to test.');
            return;
        }

        btn.disabled = true;
        status.innerHTML = 'Sending request to Google Servers...';
        jsonOutput.textContent = '...';
        
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        
        const requestBody = {
            contents: [{
                parts: [{ text: prompt }]
            }]
        };

        const outputData = {
            request: {
                endpoint: `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                method: "POST",
                body: requestBody
            },
            response: null
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            outputData.response = data;
            
            if (response.ok) {
                status.innerHTML = '<span class="success">Success! API is working and you have available quota.</span>';
            } else if (response.status === 429) {
                status.innerHTML = '<span class="error">Error 429: You are still out of quota! Wait a bit longer.</span>';
            } else {
                status.innerHTML = `<span class="error">Error ${response.status}: ${response.statusText}</span>`;
            }
        } catch (error) {
            outputData.response = { error: error.message };
            status.innerHTML = `<span class="error">Network Error: ${error.message}</span>`;
        }

        jsonOutput.textContent = JSON.stringify(outputData, null, 2);
        btn.disabled = false;
    }
</script>

</body>
</html>
